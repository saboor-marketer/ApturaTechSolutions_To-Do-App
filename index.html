<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Aptura Tech Solutions - To-Do App</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="background-gradient"></div>
    
    <div class="container">
        <!-- Header with Logo and Brand Name -->
        <header class="header glass-effect">
            <div class="header-content">
                <img src="assets/logo.jpg" alt="Aptura Tech Solutions Logo" class="logo">
                <h1 class="brand-name">Aptura Tech Solutions</h1>
            </div>
        </header>

        <!-- Main To-Do App Container -->
        <main class="main-content">
            <div class="todo-container glass-effect">
                <h2 class="app-title">My Tasks</h2>
                
                <!-- Add Task Form -->
                <div class="add-task-form">
                    <div class="input-group">
                        <input 
                            type="text" 
                            class="form-control task-input" 
                            id="taskInput" 
                            placeholder="Add a new task..."
                            aria-label="New task"
                        >
                        <button class="btn btn-add" id="addTaskBtn" type="button">
                            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <line x1="12" y1="5" x2="12" y2="19"></line>
                                <line x1="5" y1="12" x2="19" y2="12"></line>
                            </svg>
                            Add
                        </button>
                    </div>
                </div>

                <!-- Task Filters -->
                <div class="filter-buttons">
                    <button class="btn btn-filter active" data-filter="all">All</button>
                    <button class="btn btn-filter" data-filter="active">Active</button>
                    <button class="btn btn-filter" data-filter="completed">Completed</button>
                </div>

                <!-- Task List -->
                <ul class="task-list" id="taskList">
                    <!-- Tasks will be dynamically added here -->
                </ul>

                <!-- Empty State -->
                <div class="empty-state" id="emptyState">
                    <svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
                        <polyline points="22 4 12 14.01 9 11.01"></polyline>
                    </svg>
                    <p>No tasks yet. Add your first task above!</p>
                </div>

                <!-- Task Statistics -->
                <div class="task-stats">
                    <span id="taskCount">0 tasks</span>
                    <button class="btn btn-clear" id="clearCompletedBtn">Clear Completed</button>
                </div>
            </div>
        </main>

        <!-- Footer -->
        <footer class="footer glass-effect">
            <p>&copy; 2026 Aptura Tech Solutions. All rights reserved.</p>
        </footer>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/script.js"></script>
</body>
</html>
